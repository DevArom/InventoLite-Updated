<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InventoLite - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md">
        <div class="glass rounded-3xl shadow-2xl p-10">
            <h1 class="text-5xl font-bold text-center mb-4 bg-gradient-to-r from-blue-400 to-cyan-300 bg-clip-text text-transparent">InventoLite</h1>
            <p class="text-center text-gray-400 mb-10 text-lg">Manage your inventory effortlessly</p>

            <form id="loginForm" onsubmit="return loginUser()" class="space-y-6">
                <input type="text" id="username" placeholder="Username" class="w-full p-5 bg-gray-800/50 text-white rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-500 transition" required>
                <input type="password" id="password" placeholder="Password" class="w-full p-5 bg-gray-800/50 text-white rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-500 transition" required>
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 text-white font-bold py-5 rounded-xl transition transform hover:scale-105">Login</button>
            </form>

            <p id="message" class="mt-6 text-center text-lg font-medium"></p>

            <div class="mt-8 text-center">
                <p class="text-gray-400 mb-4">New here? Create an account</p>
                <a href="register.html"><button class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold px-10 py-4 rounded-xl transition transform hover:scale-105">Register Now</button></a>
            </div>

            <p class="mt-8 text-center text-gray-500 text-sm">Demo: user1 / pass1</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
